<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Losowanie Ról</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: one centered column, one screen at a time (setup → handoff → reveal → done). Dark by design: the phone gets passed around a dim table. */
:root {
  --bg: #15121a;
  --surface: #211c27;
  --line: #3a3242;
  --fg: #efe6da;
  --muted: #a99db0;
  --accent: #c9a24a;
  --mafia: #d1494b;
  --medyk: #4fb38f;
  --szeryf: #d9ad3f;
  --town: #b9aec4;
  --power: #a597e6;
  --story: #d98e6a;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 30rem;
  margin: 0 auto;
  min-height: 100%;
  padding-inline: 16px;
  padding-block: 24px 32px;
  display: flex;
  flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 20px; flex: 1; }
h1, h2 {
  font-family: var(--font-display);
  font-weight: 400;
  margin: 0;
  text-wrap: balance;
  line-height: 1.1;
}
h1 { font-size: 2.6rem; }
h2 { font-size: 2rem; }
.eyebrow {
  font-size: .75rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
p { margin: 0; }
.muted { color: var(--muted); }

/* Players */
.add-row { display: flex; gap: 8px; }
.add-row input {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
}
.add-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.players li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.players .num { width: 1.6rem; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
.players .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.empty { color: var(--muted); padding: 12px 0; border-bottom: 1px solid var(--line); }

/* Roles config */
.config { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.config-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.config-row .label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper output { min-width: 2ch; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span {
  position: absolute; inset: 0;
  background: var(--line);
  border-radius: 14px;
  transition: background .15s;
  pointer-events: none;
}
.switch span::after {
  content: "";
  position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--fg);
  transition: transform .15s;
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { font-size: .95rem; color: var(--muted); }
.warn { color: var(--mafia); font-size: .95rem; font-weight: 600; }

/* Buttons */
button {
  font: inherit;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  color: var(--fg);
  background: var(--surface);
  padding: 12px 16px;
  font-weight: 600;
}
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  font-weight: 800;
  font-size: 1.1rem;
  padding: 16px;
  width: 100%;
}
.btn-ghost { background: transparent; border: 1px solid var(--line); width: 100%; }
.btn-icon { width: 40px; height: 40px; padding: 0; font-size: 1.3rem; line-height: 1; background: var(--surface); }
.btn-remove { background: transparent; color: var(--muted); width: 36px; height: 36px; padding: 0; font-size: 1.3rem; }
.spacer { flex: 1; }
.actions { display: flex; flex-direction: column; gap: 10px; }

/* Handoff */
.handoff { justify-content: center; text-align: center; align-items: center; }
.handoff .who { font-family: var(--font-display); font-size: 3.2rem; line-height: 1.05; overflow-wrap: anywhere; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); }
.progress-bar { width: 100%; height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
.progress-bar div { height: 100%; background: var(--accent); transition: width .2s; }

/* Role card */
.card {
  border: 2px solid var(--role);
  border-radius: 18px;
  padding: 28px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  animation: flip .35s ease-out;
}
.card .role-name { font-family: var(--font-display); font-size: 3.4rem; color: var(--role); line-height: 1; }
.card .for { color: var(--muted); }
.card .desc { max-width: 26rem; }
.card .partners { border-top: 1px solid var(--line); padding-top: 14px; width: 100%; }
.card .partners strong { color: var(--role); }
.sigil { width: 64px; height: 64px; }
@keyframes flip { from { transform: scale(.94); } to { transform: none; } }

/* Power cards */
.power-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.power-bulk { display: flex; gap: 8px; padding-top: 12px; }
.power-bulk button { padding: 6px 12px; font-size: .85rem; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.power-row { align-items: flex-start; }
.power-row .label { flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.power-row .pdesc { font-weight: 400; font-size: .88rem; color: var(--muted); }
.power-card {
  border: 1px dashed var(--power);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.power-card .eyebrow { color: var(--power); }
.power-card .pname { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; color: var(--power); }
.power-card .note { font-size: .85rem; color: var(--muted); }
.roster .p { display: block; font-size: .85rem; color: var(--power); }

/* Backstory */
.story-card { border-left: 3px solid var(--story); padding: 4px 0 4px 16px; display: flex; flex-direction: column; gap: 6px; }
.story-card .eyebrow { color: var(--story); }
.story-card .sname { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.story-card .note { font-size: .85rem; color: var(--muted); }
.roster .s { display: block; font-size: .85rem; color: var(--story); }

/* Narrator list */
.roster { list-style: none; margin: 0; padding: 0; }
.roster li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.roster .r { font-weight: 800; }

.confirm-box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.confirm-box .row { display: flex; gap: 10px; }
.confirm-box .row button { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .switch span, .switch span::after, .progress-bar div { transition: none; }
}
</style>
</head>
<body>
<main class="app" id="app"></main>

<script>
(() => {
  const ROLES = {
    mafia: {
      name: "Mafia",
      color: "var(--mafia)",
      desc: "W nocy razem z resztą mafii wybierasz jedną osobę do wyeliminowania. W dzień udajesz niewinnego mieszkańca."
    },
    medyk: {
      name: "Medyk",
      color: "var(--medyk)",
      desc: "Każdej nocy wskazujesz jedną osobę do ochrony. Jeśli mafia wybierze właśnie ją, przeżyje."
    },
    szeryf: {
      name: "Szeryf",
      color: "var(--szeryf)",
      desc: "Każdej nocy sprawdzasz jedną osobę. Prowadzący pokaże Ci, czy należy do mafii."
    },
    town: {
      name: "Mieszkaniec",
      color: "var(--town)",
      desc: "Nie masz nocnej akcji. W dzień szukasz mafii i głosujesz, kogo wyeliminować."
    }
  };

  const SIGILS = {
    mafia: '<svg class="sigil" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M10 38h44l-4-6H14z"/><path fill="currentColor" d="M18 32l3-18c1-4 5-5 8-3l3 2 3-2c3-2 7-1 8 3l3 18z"/><rect x="10" y="38" width="44" height="4" rx="2" fill="currentColor" opacity=".55"/></svg>',
    medyk: '<svg class="sigil" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M26 10h12v16h16v12H38v16H26V38H10V26h16z"/></svg>',
    szeryf: '<svg class="sigil" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 6l7 13 14-2-6 13 10 10-14 2-1 15-10-9-10 9-1-15-14-2 10-10-6-13 14 2z"/><circle cx="32" cy="34" r="7" fill="var(--bg)"/></svg>',
    town: '<svg class="sigil" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 10L8 30h6v24h14V40h8v14h14V30h6z"/></svg>'
  };

  // Każda karta działa raz na grę. Gracz zgłasza jej użycie prowadzącemu.
  const POWERS = [
    { id: "kamizelka", name: "Kamizelka kuloodporna", desc: "Przeżywasz pierwszy nocny atak mafii na Ciebie." },
    { id: "immunitet", name: "Immunitet", desc: "Raz unikasz wyeliminowania w dziennym głosowaniu. Odpada osoba z drugim wynikiem." },
    { id: "podwojny", name: "Podwójny głos", desc: "W jednym dziennym głosowaniu Twój głos liczy się podwójnie." },
    { id: "weto", name: "Weto", desc: "Raz anulujesz dzienne głosowanie. Tego dnia nikt nie odpada." },
    { id: "alibi", name: "Alibi", desc: "Gdy szeryf sprawdzi Cię pierwszy raz, prowadzący pokaże mu, że nie jesteś mafią." },
    { id: "podsluch", name: "Podsłuch", desc: "Raz w nocy prowadzący zdradza Ci, kogo wskazała mafia. Nie dowiesz się, kto wskazywał." },
    { id: "zemsta", name: "Zemsta", desc: "Gdy odpadniesz, wskazujesz jedną osobę, która odpada razem z Tobą." },
    { id: "testament", name: "Testament", desc: "Gdy odpadniesz, prowadzący ujawnia wszystkim rolę jednej wybranej przez Ciebie osoby." },
    { id: "kneblowanie", name: "Knebel", desc: "Raz w ciągu dnia wskazujesz osobę, która do końca dnia nie może mówić ani głosować." },
    { id: "przekupstwo", name: "Przekupstwo", desc: "Raz przenosisz głos wybranej osoby na innego kandydata w dziennym głosowaniu." },
    { id: "detektyw", name: "Detektyw", desc: "Raz w nocy pytasz prowadzącego, czy wybrana osoba ma jakąkolwiek rolę specjalną." },
    { id: "zamiana", name: "Zamiana miejsc", desc: "Raz w nocy wskazujesz osobę. Jeśli mafia zaatakuje Ciebie, zginie ona zamiast Ciebie." }
  ];
  const POWER_BY_ID = Object.fromEntries(POWERS.map(c => [c.id, c]));

  // Historie są neutralne wobec ról: mafia opowiada swoją tak samo jak mieszkańcy.
  const STORIES = [
    { t: "Emerytowany listonosz", d: "Przez 40 lat roznosiłeś listy w tym mieście. Znasz każdą skrzynkę pocztową i wiesz, kto dostaje dziwne paczki." },
    { t: "Właścicielka piekarni", d: "Wstajesz o 3:00, żeby piec chleb. Widziałaś, kto wraca do domu nad ranem, ale nikomu nie mówiłaś." },
    { t: "Nowy w mieście", d: "Przyjechałeś tydzień temu z dużego miasta. Nikt nie wie, czym się wcześniej zajmowałeś, a Ty nie lubisz o tym mówić." },
    { t: "Lokalny hydraulik", d: "Byłeś w piwnicy prawie każdego domu. W jednej z nich znalazłeś coś, czego nie powinieneś był zobaczyć." },
    { t: "Proboszcz parafii", d: "Słuchasz spowiedzi całego miasta. Tajemnica spowiedzi coraz bardziej Ci ciąży." },
    { t: "Nauczycielka matematyki", d: "Uczyłaś połowę osób przy tym stole. Pamiętasz, kto ściągał na klasówkach." },
    { t: "Barman z Pod Kogutem", d: "Nalewasz piwo od 20 lat. Ludzie po trzecim kuflu mówią Ci rzeczy, których nie powiedzieliby nikomu." },
    { t: "Wnuczka burmistrza", d: "Wróciłaś ze studiów za granicą. Plotki mówią, że dziadek ma długi u niewłaściwych ludzi." },
    { t: "Taksówkarz na nocnej zmianie", d: "Wozisz ludzi po nocach i nie zadajesz pytań. Ostatnio jeden kurs skończył się pod opuszczonym magazynem." },
    { t: "Fryzjerka", d: "W Twoim salonie plotki krążą szybciej niż nożyczki. Wiesz, kto z kim się pokłócił w tym tygodniu." },
    { t: "Weterynarz", d: "Leczysz psy i koty całego miasta. Wczoraj ktoś przyniósł psa z raną, która nie wyglądała na ugryzienie." },
    { t: "Były bokser", d: "Kiedyś walczyłeś o mistrzostwo województwa. Teraz prowadzisz siłownię i spłacasz pożyczkę, o której wolisz nie mówić." },
    { t: "Kwiaciarka", d: "Ktoś co tydzień zamawia u Ciebie wieniec pogrzebowy, zawsze dzień przed czyimś zniknięciem." },
    { t: "Dziennikarz lokalnej gazety", d: "Od miesięcy piszesz artykuł o korupcji w mieście. Ktoś włamał się do Twojego biura i zabrał notatki." },
    { t: "Ogrodnik z willi na wzgórzu", d: "Pracujesz dla najbogatszej rodziny w okolicy. Pod różami zakopano coś, co nie jest kompostem." },
    { t: "Pielęgniarka z przychodni", d: "Masz dostęp do szafki z lekami. W zeszłym tygodniu kilku opakowań zabrakło, a Ty nie zgłosiłaś tego szefowi." },
    { t: "Sprzedawca używanych aut", d: "Każde auto ma swoją historię. Jedno, które sprzedałeś miesiąc temu, miało w bagażniku dziurę po kuli." },
    { t: "Organistka", d: "Grasz na każdym ślubie i pogrzebie. Ostatnio pogrzebów jest więcej niż ślubów i zaczyna Cię to niepokoić." },
    { t: "Kierowca autobusu", d: "Codziennie tą samą trasą. Od tygodnia na przystanku przy cmentarzu wsiada ten sam człowiek w kapeluszu." },
    { t: "Wędkarz z jeziora", d: "Spędzasz noce nad wodą. Trzy dni temu ktoś o północy wrzucił do jeziora ciężką torbę." },
    { t: "Właściciel lombardu", d: "Ludzie przynoszą Ci rzeczy i nie pytasz, skąd je mają. Wczoraj ktoś zastawił zegarek z wygrawerowanym nazwiskiem zaginionego." },
    { t: "Sołtyska", d: "Znasz wszystkich i wszystkich pilnujesz. Ostatnio ktoś podrzucił Ci anonim z groźbą." },
    { t: "Student na wakacjach", d: "Przyjechałeś do babci na lato i miało być nudno. Wczoraj w nocy obudził Cię strzał gdzieś za lasem." },
    { t: "Kucharz w szkolnej stołówce", d: "Gotujesz dla dzieci i nauczycieli. Ktoś regularnie zamawia u Ciebie dziesięć obiadów na wynos do starego młyna." },
    { t: "Zegarmistrz", d: "Naprawiasz zegary od 30 lat. Każdy w mieście ma u Ciebie coś w naprawie, a Ty znasz ich rozkład dnia co do minuty." },
    { t: "Instruktorka jazdy", d: "Uczyłaś jeździć połowę miasta. Jedna z Twoich kursantek nagle kupiła drogie auto za gotówkę." },
    { t: "Strażak ochotnik", d: "Gasiłeś ostatni pożar stodoły. Wszyscy mówili, że to zwarcie, ale Ty czułeś zapach benzyny." },
    { t: "Antykwariusz", d: "Handlujesz starociami. Ktoś zaoferował Ci obraz, który według katalogu wisi w muzeum w Krakowie." },
    { t: "Pszczelarz", d: "Twoje ule stoją na skraju lasu. Pszczoły od tygodnia omijają jedną polanę i nie wiesz dlaczego." },
    { t: "Listonoszka na zastępstwie", d: "Rozwozisz pocztę od miesiąca. Jedna koperta bez nadawcy wraca do Ciebie codziennie, choć adres jest prawidłowy." }
  ];

  const STORE_KEY = "mafia-roles-v1";
  const app = document.getElementById("app");

  const saved = load();
  const state = {
    players: saved.players || [],
    mafia: saved.mafia || 1,
    medyk: saved.medyk ?? true,
    szeryf: saved.szeryf ?? true,
    mafiaTouched: saved.mafiaTouched || false,
    powersOn: saved.powersOn ?? false,
    storiesOn: saved.storiesOn ?? false,
    powers: (saved.powers || POWERS.map(c => c.id)).filter(id => POWER_BY_ID[id]),
    assignment: null,   // [{ name, role, power }]
    index: 0,
    phase: "setup",     // setup | handoff | reveal | done
    confirm: null,
    showRoster: false
  };

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        players: state.players, mafia: state.mafia, medyk: state.medyk,
        szeryf: state.szeryf, mafiaTouched: state.mafiaTouched,
        powersOn: state.powersOn, powers: state.powers, storiesOn: state.storiesOn
      }));
    } catch {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function suggestedMafia(n) { return Math.max(1, Math.floor(n / 4)); }

  function randInt(max) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / max) * max;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % max;
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function validate() {
    const n = state.players.length;
    const specials = state.mafia + (state.medyk ? 1 : 0) + (state.szeryf ? 1 : 0);
    if (n < 3) return { ok: false, msg: "Dodaj co najmniej 3 graczy." };
    if (specials > n) return { ok: false, msg: `Za dużo ról specjalnych (${specials}) na ${n} graczy.` };
    if (state.mafia * 2 >= n) return { ok: false, msg: "Mafii musi być mniej niż połowa graczy, inaczej wygrywa od razu." };
    if (state.powersOn && !state.powers.length) return { ok: false, msg: "Włącz co najmniej jedną kartę mocy albo wyłącz karty mocy." };
    return { ok: true };
  }

  function deal() {
    const roles = [];
    for (let i = 0; i < state.mafia; i++) roles.push("mafia");
    if (state.medyk) roles.push("medyk");
    if (state.szeryf) roles.push("szeryf");
    while (roles.length < state.players.length) roles.push("town");
    const shuffled = shuffle(roles);
    const powers = state.powersOn ? drawPowers(state.players.length) : [];
    const stories = state.storiesOn ? drawFrom(STORIES.map((_, i) => i), state.players.length) : [];
    state.assignment = state.players.map((name, i) => ({ name, role: shuffled[i], power: powers[i] || null, story: stories[i] ?? null }));
    state.index = 0;
    state.phase = "handoff";
    state.confirm = null;
    state.showRoster = false;
    requestWakeLock();
  }

  // Karty nie powtarzają się, dopóki starcza talii. Potem talia jest tasowana od nowa.
  function drawFrom(pool, n) {
    const out = [];
    while (out.length < n) out.push(...shuffle(pool));
    return out.slice(0, n);
  }
  function drawPowers(n) { return drawFrom(state.powers, n); }

  let wakeLock = null;
  async function requestWakeLock() {
    try { if ("wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.phase !== "setup") { wakeLock = null; requestWakeLock(); }
  });

  function addPlayer(raw) {
    const name = raw.trim().replace(/\s+/g, " ");
    if (!name) return "";
    if (state.players.some(p => p.toLowerCase() === name.toLowerCase())) return `${name} już jest na liście.`;
    state.players.push(name);
    if (!state.mafiaTouched) state.mafia = suggestedMafia(state.players.length);
    save();
    return "";
  }

  // ---------- Render ----------
  function render(focusInput) {
    const fn = { setup: renderSetup, handoff: renderHandoff, reveal: renderReveal, done: renderDone }[state.phase];
    app.innerHTML = fn();
    if (focusInput) {
      const inp = document.getElementById("name-input");
      if (inp) inp.focus();
    }
    if (state.phase !== lastPhase || state.phase !== "setup") window.scrollTo(0, 0);
    lastPhase = state.phase;
  }
  let lastPhase = null;

  function renderSetup() {
    const n = state.players.length;
    const v = validate();
    const town = Math.max(0, n - state.mafia - (state.medyk ? 1 : 0) - (state.szeryf ? 1 : 0));
    const list = n
      ? state.players.map((p, i) => `
          <li>
            <span class="num">${i + 1}.</span>
            <span class="name">${esc(p)}</span>
            <button class="btn-remove" data-act="remove" data-i="${i}" aria-label="Usuń ${esc(p)}">×</button>
          </li>`).join("")
      : `<li class="empty">Nikogo jeszcze nie ma. Wpisz imiona w kolejności, w jakiej będziecie podawać telefon.</li>`;

    return `
      <section class="screen">
        <div>
          <div class="eyebrow">Mafia</div>
          <h1>Losowanie ról</h1>
        </div>

        <form class="add-row" id="add-form" autocomplete="off">
          <input id="name-input" type="text" placeholder="Imię gracza" maxlength="24" enterkeyhint="done" aria-label="Imię gracza">
          <button type="submit">Dodaj</button>
        </form>
        <p class="warn" id="add-err" hidden></p>

        <div>
          <div class="eyebrow">Gracze (${n})</div>
          <ul class="players">${list}</ul>
        </div>

        <div>
          <div class="eyebrow">Role</div>
          <div class="config">
            <div class="config-row">
              <span class="label"><span class="dot" style="background:var(--mafia)"></span>Mafia</span>
              <div class="stepper">
                <button class="btn-icon" data-act="mafia-dec" aria-label="Mniej mafii" ${state.mafia <= 1 ? "disabled" : ""}>−</button>
                <output id="mafia-count">${state.mafia}</output>
                <button class="btn-icon" data-act="mafia-inc" aria-label="Więcej mafii">+</button>
              </div>
            </div>
            <label class="config-row" for="t-medyk">
              <span class="label"><span class="dot" style="background:var(--medyk)"></span>Medyk</span>
              <span class="switch"><input type="checkbox" id="t-medyk" data-act="toggle-medyk" ${state.medyk ? "checked" : ""}><span></span></span>
            </label>
            <label class="config-row" for="t-szeryf">
              <span class="label"><span class="dot" style="background:var(--szeryf)"></span>Szeryf</span>
              <span class="switch"><input type="checkbox" id="t-szeryf" data-act="toggle-szeryf" ${state.szeryf ? "checked" : ""}><span></span></span>
            </label>
          </div>
        </div>

        <div>
          <div class="config">
            <label class="config-row" for="t-powers">
              <span class="label"><span class="dot" style="background:var(--power)"></span>Karty mocy</span>
              <span class="switch"><input type="checkbox" id="t-powers" data-act="toggle-powers" ${state.powersOn ? "checked" : ""}><span></span></span>
            </label>
          </div>
          ${state.powersOn ? renderPowerList() : ""}
        </div>

        <div>
          <div class="config">
            <label class="config-row" for="t-stories">
              <span class="label"><span class="dot" style="background:var(--story)"></span>Backstory</span>
              <span class="switch"><input type="checkbox" id="t-stories" data-act="toggle-stories" ${state.storiesOn ? "checked" : ""}><span></span></span>
            </label>
          </div>
          ${state.storiesOn ? `<p class="summary" style="padding-top:10px">Każdy gracz losuje jedną z ${STORIES.length} historii i opowiada ją pozostałym pierwszego dnia.</p>` : ""}
        </div>

        <p class="summary">Pozostali gracze (${town}) to mieszkańcy bez nocnej akcji.${state.mafiaTouched ? "" : ` Liczba mafii dobiera się sama: 1 na każde 4 osoby.`}</p>
        ${v.ok ? "" : `<p class="warn">${v.msg}</p>`}

        <div class="spacer"></div>
        <div class="actions">
          <button class="btn-primary" data-act="deal" ${v.ok ? "" : "disabled"}>Losuj role</button>
          ${n ? `<button class="btn-ghost" data-act="clear">Wyczyść listę</button>` : ""}
          ${state.confirm === "clear" ? confirmBox("Usunąć wszystkich graczy z listy?", "clear-yes") : ""}
        </div>
      </section>`;
  }

  function renderPowerList() {
    const on = new Set(state.powers);
    const rows = POWERS.map(c => `
      <label class="config-row power-row" for="pc-${c.id}">
        <span class="label"><span>${c.name}</span><span class="pdesc">${c.desc}</span></span>
        <span class="switch"><input type="checkbox" id="pc-${c.id}" data-act="toggle-card" data-id="${c.id}" ${on.has(c.id) ? "checked" : ""}><span></span></span>
      </label>`).join("");
    const n = state.players.length;
    const repeat = n > state.powers.length && state.powers.length
      ? ` Graczy jest więcej niż kart, więc część kart się powtórzy.` : "";
    return `
      <div class="power-bulk">
        <button data-act="cards-all">Włącz wszystkie</button>
        <button data-act="cards-none">Wyłącz wszystkie</button>
      </div>
      <p class="summary" style="padding-top:10px">Każdy gracz dostaje jedną losową kartę z ${state.powers.length} włączonych.${repeat}</p>
      <div class="config" style="border-top:none">${rows}</div>`;
  }

  function progress() {
    const total = state.assignment.length;
    return `
      <div style="width:100%;display:flex;flex-direction:column;gap:8px">
        <div class="progress">Gracz ${state.index + 1} z ${total}</div>
        <div class="progress-bar"><div style="width:${(state.index / total) * 100}%"></div></div>
      </div>`;
  }

  function renderHandoff() {
    const p = state.assignment[state.index];
    return `
      <section class="screen handoff">
        ${progress()}
        <div class="spacer"></div>
        <p class="muted">Podaj telefon do</p>
        <div class="who">${esc(p.name)}</div>
        <p class="muted">Upewnij się, że nikt inny nie patrzy na ekran.</p>
        <div class="spacer"></div>
        <div class="actions" style="width:100%">
          <button class="btn-primary" data-act="show">Jestem ${esc(p.name)}, pokaż rolę</button>
          <button class="btn-ghost" data-act="abort">Przerwij grę</button>
          ${state.confirm === "abort" ? confirmBox("Przerwać? Role trzeba będzie wylosować od nowa.", "abort-yes") : ""}
        </div>
      </section>`;
  }

  function renderReveal() {
    const p = state.assignment[state.index];
    const r = ROLES[p.role];
    let partners = "";
    if (p.role === "mafia") {
      const others = state.assignment.filter(a => a.role === "mafia" && a.name !== p.name).map(a => `<strong>${esc(a.name)}</strong>`);
      partners = `<div class="partners">${others.length ? `Twoja mafia: ${others.join(", ")}` : "Działasz sam."}</div>`;
    }
    const last = state.index === state.assignment.length - 1;
    return `
      <section class="screen">
        ${progress()}
        <div class="card" style="--role:${r.color}">
          <span class="for">${esc(p.name)}, Twoja rola to</span>
          <span style="color:var(--role)">${SIGILS[p.role]}</span>
          <span class="role-name">${r.name}</span>
          <p class="desc">${r.desc}</p>
          ${partners}
        </div>
        ${p.power ? `
        <div class="power-card">
          <span class="eyebrow">Twoja karta mocy</span>
          <span class="pname">${POWER_BY_ID[p.power].name}</span>
          <p>${POWER_BY_ID[p.power].desc}</p>
          <p class="note">Działa raz na grę. Gdy chcesz jej użyć, daj znać prowadzącemu.</p>
        </div>` : ""}
        ${p.story !== null ? `
        <div class="story-card">
          <span class="eyebrow">Twoje backstory</span>
          <span class="sname">${STORIES[p.story].t}</span>
          <p>${STORIES[p.story].d}</p>
          <p class="note">Pierwszego dnia opowiesz tę historię reszcie graczy. Możesz ją ubarwić własnymi szczegółami.</p>
        </div>` : ""}
        <div class="spacer"></div>
        <button class="btn-primary" data-act="hide">${last ? "Zapamiętane, zakończ" : "Zapamiętane, ukryj i podaj dalej"}</button>
      </section>`;
  }

  function renderDone() {
    const roster = state.assignment.map(a => {
      const r = ROLES[a.role];
      const pw = a.power ? `<span class="p">${POWER_BY_ID[a.power].name}</span>` : "";
      const st = a.story !== null ? `<span class="s">${STORIES[a.story].t}</span>` : "";
      return `<li><span>${esc(a.name)}${pw}${st}</span><span class="r" style="color:${r.color}">${r.name}</span></li>`;
    }).join("");
    return `
      <section class="screen">
        <div>
          <div class="eyebrow">Wszyscy znają role</div>
          <h2>Miasto zasypia</h2>
        </div>
        <p class="muted">Oddajcie telefon prowadzącemu. Tylko prowadzący może zajrzeć do listy ról.</p>
        ${state.assignment.some(x => x.story !== null) ? `<p>Pierwszego dnia każdy po kolei opowiada swoje backstory.</p>` : ""}
        ${state.showRoster
          ? `<ul class="roster">${roster}</ul>
             <button class="btn-ghost" data-act="hide-roster">Ukryj listę</button>`
          : `<button class="btn-ghost" data-act="show-roster">Pokaż role (tylko prowadzący)</button>
             ${state.confirm === "roster" ? confirmBox("Na pewno jesteś prowadzącym? Lista pokaże role wszystkich graczy.", "roster-yes") : ""}`}
        <div class="spacer"></div>
        <div class="actions">
          <button class="btn-primary" data-act="deal">Nowe losowanie, ci sami gracze</button>
          <button class="btn-ghost" data-act="to-setup">Zmień graczy lub role</button>
        </div>
      </section>`;
  }

  function confirmBox(text, yesAct) {
    return `
      <div class="confirm-box">
        <p>${text}</p>
        <div class="row">
          <button class="btn-ghost" data-act="confirm-no">Anuluj</button>
          <button class="btn-primary" data-act="${yesAct}" style="font-size:1rem;padding:12px">Tak</button>
        </div>
      </div>`;
  }

  // ---------- Events ----------
  app.addEventListener("submit", e => {
    e.preventDefault();
    const inp = document.getElementById("name-input");
    const err = addPlayer(inp.value);
    render(true);
    if (err) {
      const el = document.getElementById("add-err");
      el.textContent = err;
      el.hidden = false;
      document.getElementById("name-input").value = inp.value;
    }
  });

  app.addEventListener("change", e => {
    const act = e.target.dataset.act;
    if (!act) return;
    if (act === "toggle-medyk") state.medyk = e.target.checked;
    if (act === "toggle-szeryf") state.szeryf = e.target.checked;
    if (act === "toggle-powers") state.powersOn = e.target.checked;
    if (act === "toggle-stories") state.storiesOn = e.target.checked;
    if (act === "toggle-card") {
      const id = e.target.dataset.id;
      state.powers = e.target.checked
        ? POWERS.map(c => c.id).filter(x => x === id || state.powers.includes(x))
        : state.powers.filter(x => x !== id);
    }
    save();
    render();
  });

  app.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    switch (act) {
      case "remove":
        state.players.splice(+btn.dataset.i, 1);
        if (!state.mafiaTouched) state.mafia = suggestedMafia(state.players.length);
        break;
      case "mafia-dec": state.mafia = Math.max(1, state.mafia - 1); state.mafiaTouched = true; break;
      case "mafia-inc": state.mafia += 1; state.mafiaTouched = true; break;
      case "clear": state.confirm = "clear"; break;
      case "cards-all": state.powers = POWERS.map(c => c.id); break;
      case "cards-none": state.powers = []; break;
      case "clear-yes": state.players = []; state.mafia = 1; state.mafiaTouched = false; state.confirm = null; break;
      case "deal": if (validate().ok) deal(); break;
      case "show": state.phase = "reveal"; state.confirm = null; break;
      case "hide":
        state.index += 1;
        state.phase = state.index >= state.assignment.length ? "done" : "handoff";
        break;
      case "abort": state.confirm = "abort"; break;
      case "abort-yes": state.phase = "setup"; state.assignment = null; state.confirm = null; break;
      case "show-roster": state.confirm = "roster"; break;
      case "roster-yes": state.showRoster = true; state.confirm = null; break;
      case "hide-roster": state.showRoster = false; break;
      case "to-setup": state.phase = "setup"; state.assignment = null; state.confirm = null; break;
      case "confirm-no": state.confirm = null; break;
      default: return;
    }
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
