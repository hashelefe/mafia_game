<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="shared.js"></script>
<script>
/*
 * Tryb online. Telefon mistrza gry trzyma stan lobby, losuje role i każdemu graczowi
 * wysyła wyłącznie jego własną rolę, kartę i historię.
 *
 * Wiadomości idą przez publiczne brokery MQTT (przez WebSocket na https), więc telefony
 * nie muszą łączyć się ze sobą bezpośrednio i działają w dowolnych sieciach.
 * Używamy dwóch brokerów naraz: jeśli jeden nie działa, wystarczy drugi.
 *
 * Broker jest publiczny, dlatego wszystko poza imieniem przy dołączaniu jest szyfrowane
 * (ECDH P-256 + AES-GCM). Mistrz gry przypina klucz publiczny gracza przy pierwszym
 * dołączeniu, więc nikt nie podszyje się pod gracza, żeby odebrać jego rolę.
 */
(() => {
  const { ROLES, POWER_BY_ID, STORIES, esc, defaultConfig, validate, deal, renderConfig,
          applyConfigAction, autoMafia, renderIdentity, confirmBox, keepAwake } = window.Mafia;

  // Parametr ?broker=ws://host:port pozwala użyć własnego brokera (np. do testów).
  const BROKERS = (() => {
    const v = new URLSearchParams(location.search).get("broker");
    return v ? [v] : ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
  })();
  const TOPIC = "mafia-pl-v2";
  const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const HOST_KEY = "mafia-online-host-v2";
  const PLAYER_KEY = "mafia-online-player-v2";
  const CONFIG_KEY = "mafia-roles-v1";   // te same ustawienia ról co w trybie jednego telefonu
  const PING_MS = 4000;
  const TIMEOUT_MS = 13000;
  const NOTFOUND_MS = 7000;

  const app = document.getElementById("app");
  const ui = { screen: "home", confirm: null, error: "", reveal: false, status: "connecting" };

  function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; } }
  function writeJSON(key, v) { try { v === null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(v)); } catch {} }
  function randomCode() { let s = ""; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
  function randomToken() { return Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join(""); }
  function cleanName(raw) { return String(raw || "").trim().replace(/\s+/g, " ").slice(0, 24); }
  function cleanCode(raw) { return String(raw || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); }
  function clock(ts) { return new Date(ts).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }); }
  function lobbyUrl(code) { return location.href.split("#")[0] + "#" + code; }
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
  const topics = code => ({
    host: `${TOPIC}/${code}/host`,
    inbox: `${TOPIC}/${code}/in`,
    to: token => `${TOPIC}/${code}/to/${token}`
  });

  // =====================================================================
  // SZYFROWANIE
  // =====================================================================
  const subtle = crypto.subtle;
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function newKeyPair() {
    const kp = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    return { priv: await subtle.exportKey("jwk", kp.privateKey), pub: await subtle.exportKey("jwk", kp.publicKey) };
  }
  function pubOnly(jwk) { return { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y }; }
  function samePub(a, b) { return a && b && a.x === b.x && a.y === b.y; }
  async function sharedKey(privJwk, pubJwk) {
    const priv = await subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    const pub = await subtle.importKey("jwk", pubOnly(pubJwk), { name: "ECDH", namedCurve: "P-256" }, false, []);
    return subtle.deriveKey({ name: "ECDH", public: pub }, priv, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function open(key, box) {
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // =====================================================================
  // TRANSPORT: kilka brokerów naraz, duplikaty odrzucane po id wiadomości
  // =====================================================================
  function createBus(subs, onMessage, onStatus) {
    const seen = new Set();
    const seenOrder = [];
    const clients = BROKERS.map(url => {
      const c = mqtt.connect(url, {
        clientId: "mafia-" + randomToken(),
        clean: true,
        keepalive: 30,
        reconnectPeriod: 2500,
        connectTimeout: 10000
      });
      c.on("connect", () => {
        c.subscribe(subs(), { qos: 1 });
        onStatus(true, c);
      });
      c.on("close", () => onStatus(false, c));
      c.on("offline", () => onStatus(false, c));
      c.on("error", () => {});
      c.on("message", (topic, payload, packet) => {
        const text = payload.toString();
        if (!text) { onMessage(topic, null, packet.retain); return; }
        let msg;
        try { msg = JSON.parse(text); } catch { return; }
        if (!msg || typeof msg !== "object") return;
        if (msg.mid) {
          if (seen.has(msg.mid)) return;
          seen.add(msg.mid); seenOrder.push(msg.mid);
          if (seenOrder.length > 500) seen.delete(seenOrder.shift());
        }
        onMessage(topic, msg, packet.retain);
      });
      return c;
    });
    return {
      publish(topic, obj, opts = {}) {
        const body = obj === null ? "" : JSON.stringify({ ...obj, mid: randomToken() });
        for (const c of clients) if (c.connected) c.publish(topic, body, { qos: opts.qos ?? 1, retain: !!opts.retain });
      },
      connected() { return clients.some(c => c.connected); },
      wake() { for (const c of clients) if (!c.connected && !c.disconnecting) c.reconnect(); },
      end() { for (const c of clients) { try { c.end(true); } catch {} } }
    };
  }

  // =====================================================================
  // MISTRZ GRY
  // =====================================================================
  // host = { code, hostId, keys: {priv, pub}, cfg, players: [{token, name, pub}], phase,
  //          assignment: {token: {...}}, log: [], alerts: [] }
  let host = null;
  let hostBus = null;
  let hostReady = false;           // kod sprawdzony i hello opublikowane
  const playerKeys = new Map();    // token -> AES key
  const lastSeen = new Map();      // token -> ms

  // Rośnie także po odświeżeniu strony mistrza gry, więc gracze nie odrzucą nowych wiadomości jako starych.
  let seqCounter = 0;
  function nextSeq() { seqCounter = (seqCounter + 1) % 1000; return Date.now() * 1000 + seqCounter; }

  function saveHost() {
    if (!host) return writeJSON(HOST_KEY, null);
    writeJSON(HOST_KEY, host);
    const prev = readJSON(CONFIG_KEY) || {};
    writeJSON(CONFIG_KEY, { ...prev, ...host.cfg });
  }

  async function startHost(existing) {
    ui.screen = "host";
    ui.status = "connecting";
    render();
    host = existing || {
      code: randomCode(),
      hostId: randomToken(),
      keys: await newKeyPair(),
      cfg: defaultConfig(readJSON(CONFIG_KEY) || {}),
      players: [],
      phase: "lobby",
      assignment: {},
      log: [],
      alerts: []
    };
    saveHost();
    openHostBus(!!existing);
    keepAwake();
    render();
  }

  function openHostBus(restoring) {
    if (hostBus) hostBus.end();
    hostReady = false;
    playerKeys.clear();
    const t = topics(host.code);
    let claimTimer = null;
    let collision = false;
    hostBus = createBus(
      () => [t.host, t.inbox],
      (topic, msg) => {
        if (topic === t.host) {
          // Kod zajęty przez inne, otwarte lobby.
          if (!hostReady && !restoring && msg && msg.t === "hello" && msg.hostId !== host.hostId) collision = true;
          return;
        }
        if (topic === t.inbox && msg && hostReady) handleInbox(msg);
      },
      (up) => {
        if (up && !hostReady && !claimTimer) {
          // Odczekaj chwilę na ewentualną wiadomość "retained" innego lobby z tym samym kodem.
          claimTimer = setTimeout(() => {
            claimTimer = null;
            if (collision) { host.code = randomCode(); saveHost(); openHostBus(false); return; }
            hostReady = true;
            announce();
            broadcast();
            ui.status = "online"; render();
          }, restoring ? 300 : 1500);
        } else if (up && hostReady) {
          announce();
          ui.status = "online"; render();
        } else if (!hostBus.connected()) {
          ui.status = "reconnecting"; render();
        }
      }
    );
  }

  function announce() {
    hostBus.publish(topics(host.code).host, { t: "hello", hostId: host.hostId, pub: host.keys.pub }, { retain: true });
  }

  async function keyFor(token) {
    if (playerKeys.has(token)) return playerKeys.get(token);
    const p = host.players.find(x => x.token === token);
    if (!p) return null;
    const k = await sharedKey(host.keys.priv, p.pub);
    playerKeys.set(token, k);
    return k;
  }

  async function sendTo(token, obj) {
    const key = await keyFor(token);
    if (!key || !hostBus) return;
    const box = await seal(key, { ...obj, seq: nextSeq() });
    hostBus.publish(topics(host.code).to(token), box);
  }

  // Odpowiedź bez przypiętego klucza (np. odmowa dołączenia), szyfrowana kluczem z prośby.
  async function replyRaw(token, pub, obj) {
    try {
      const key = await sharedKey(host.keys.priv, pub);
      hostBus.publish(topics(host.code).to(token), await seal(key, { ...obj, seq: nextSeq() }));
    } catch {}
  }

  async function handleInbox(msg) {
    const token = typeof msg.token === "string" ? msg.token.slice(0, 64) : "";
    if (!token) return;
    if (msg.t === "join") {
      if (!msg.pub || typeof msg.pub.x !== "string") return;
      const name = cleanName(msg.name);
      const known = host.players.find(p => p.token === token);
      if (known && !samePub(known.pub, msg.pub)) return;   // ktoś podszywa się pod gracza
      if (!name) { replyRaw(token, msg.pub, { t: "error", msg: "Podaj imię." }); return; }
      if (!known) {
        if (host.phase !== "lobby") { replyRaw(token, msg.pub, { t: "error", msg: "Gra już trwa. Poproś mistrza gry, żeby wrócił do lobby, wtedy dołączysz." }); return; }
        if (host.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
          replyRaw(token, msg.pub, { t: "error", msg: `Imię ${name} jest już zajęte w tym lobby. Wybierz inne.` }); return;
        }
        host.players.push({ token, name, pub: pubOnly(msg.pub) });
        autoMafia(host.cfg, host.players.length);
        saveHost();
        lastSeen.set(token, Date.now());
        broadcast();
        render();
        return;
      }
      if (host.phase === "lobby" && known.name !== name &&
          !host.players.some(p => p.token !== token && p.name.toLowerCase() === name.toLowerCase())) {
        known.name = name; saveHost(); broadcast();
      } else {
        sendState(token);
      }
      lastSeen.set(token, Date.now());
      render(true);
      return;
    }
    if (msg.t === "box") {
      const key = await keyFor(token);
      if (!key) return;
      let inner;
      try { inner = await open(key, msg); } catch { return; }
      lastSeen.set(token, Date.now());
      if (inner.t === "ping") sendTo(token, { t: "pong" });
      else if (inner.t === "use") handleUse(token);
      else if (inner.t === "leave") { if (host.phase === "lobby") removePlayer(token, false); }
    }
  }

  function removePlayer(token, notify) {
    if (notify) sendTo(token, { t: "kicked" });
    host.players = host.players.filter(p => p.token !== token);
    playerKeys.delete(token);
    autoMafia(host.cfg, host.players.length);
    saveHost();
    broadcast();
    render();
  }

  function handleUse(token) {
    const a = host.assignment[token];
    const p = host.players.find(x => x.token === token);
    if (host.phase !== "game" || !a || !a.power || a.used || !p) { sendState(token); return; }
    a.used = Date.now();
    const entry = { id: randomToken(), name: p.name, power: a.power, role: a.role, at: a.used };
    host.log.unshift(entry);
    host.alerts.push(entry.id);
    vibrate([200, 100, 200]);
    saveHost();
    sendState(token);
    render();
  }

  function hostDeal() {
    const n = host.players.length;
    if (!validate(host.cfg, n).ok) return;
    const dealt = deal(host.cfg, n);
    host.assignment = {};
    host.players.forEach((p, i) => { host.assignment[p.token] = { ...dealt[i], used: null }; });
    host.phase = "game";
    host.log = [];
    host.alerts = [];
    saveHost();
    broadcast();
  }

  function stateFor(token) {
    const p = host.players.find(x => x.token === token);
    if (!p) return { t: "kicked" };
    let me = null;
    if (host.phase === "game" && host.assignment[token]) {
      const a = host.assignment[token];
      const partners = a.role === "mafia"
        ? host.players.filter(x => x.token !== token && host.assignment[x.token]?.role === "mafia").map(x => x.name)
        : null;
      me = { name: p.name, role: a.role, power: a.power, story: a.story, used: a.used, partners };
    }
    return { t: "state", lobby: { code: host.code, phase: host.phase, players: host.players.map(x => x.name) }, name: p.name, me };
  }

  function sendState(token) { if (hostReady) sendTo(token, stateFor(token)); }
  function broadcast() { if (hostReady) for (const p of host.players) sendState(p.token); }
  function isOnline(token) { return Date.now() - (lastSeen.get(token) || 0) < TIMEOUT_MS; }

  function endHost() {
    if (hostBus && hostReady) {
      for (const p of host.players) sendTo(p.token, { t: "closed" });
      hostBus.publish(topics(host.code).host, null, { retain: true });   // usuń ogłoszenie lobby
    }
    const bus = hostBus;
    setTimeout(() => bus && bus.end(), 800);
    hostBus = null; hostReady = false;
    host = null;
    saveHost();
    ui.screen = "home";
    ui.confirm = null;
    render();
  }

  // Odśwież statusy online co kilka sekund.
  setInterval(() => { if (ui.screen === "host" && !ui.confirm) render(true); }, PING_MS);

  function statusBadge(s) {
    const map = {
      online: ["on", "Lobby otwarte"],
      connecting: ["wait", "Otwieram lobby…"],
      reconnecting: ["off", "Brak internetu, łączę ponownie…"]
    };
    const [cls, label] = map[s] || map.connecting;
    return `<span class="status"><span class="dot ${cls}"></span>${label}</span>`;
  }

  function renderHost() {
    if (!host) return `<section class="screen"><h2>Otwieram lobby…</h2></section>`;
    return host.phase === "lobby" ? renderHostLobby() : renderHostGame();
  }

  function renderHostLobby() {
    const n = host.players.length;
    const v = validate(host.cfg, n);
    const list = n
      ? host.players.map((p, i) => `
          <li>
            <span class="num">${i + 1}.</span>
            <span class="name">${esc(p.name)}</span>
            <span class="status"><span class="dot ${isOnline(p.token) ? "on" : "off"}"></span></span>
            <button class="btn-remove" data-act="kick" data-token="${p.token}" aria-label="Usuń ${esc(p.name)}">×</button>
          </li>`).join("")
      : `<li class="empty">Nikt jeszcze nie dołączył. Gracze otwierają tę stronę na swoich telefonach i wpisują kod.</li>`;
    return `
      <section class="screen">
        <div>
          <div class="eyebrow">Mafia online · mistrz gry</div>
          <h1>Lobby</h1>
        </div>
        ${statusBadge(ui.status)}
        <div class="code-box">
          <span class="eyebrow">Kod lobby</span>
          <span class="code">${ui.status === "connecting" ? "····" : host.code}</span>
          <span class="link">${esc(lobbyUrl(host.code))}</span>
          <button data-act="copy-link">Kopiuj link dla graczy</button>
        </div>

        <div>
          <div class="eyebrow">Gracze (${n})</div>
          <ul class="players">${list}</ul>
        </div>

        ${renderConfig(host.cfg, n)}
        ${v.ok ? "" : `<p class="warn">${v.msg}</p>`}

        <div class="spacer"></div>
        <div class="actions">
          <button class="btn-primary" data-act="host-deal" ${v.ok && hostReady ? "" : "disabled"}>Rozdaj role</button>
          <button class="btn-ghost" data-act="host-close">Zamknij lobby</button>
          ${ui.confirm === "close" ? confirmBox("Zamknąć lobby? Wszyscy gracze zostaną rozłączeni.", "host-close-yes") : ""}
        </div>
      </section>`;
  }

  function renderHostGame() {
    const alerts = host.alerts.map(id => host.log.find(e => e.id === id)).filter(Boolean);
    const alertHtml = alerts.map(e => `
      <div class="alert" role="alert">
        <span class="eyebrow" style="color:var(--power)">Użycie karty · ${clock(e.at)}</span>
        <span class="who-uses">${esc(e.name)} używa karty <em>${POWER_BY_ID[e.power].name}</em></span>
        <p>${POWER_BY_ID[e.power].desc}</p>
        <p class="muted">Rola: <strong style="color:${ROLES[e.role].color}">${ROLES[e.role].name}</strong></p>
        <button class="btn-ghost" data-act="ack" data-id="${e.id}">Przyjąłem</button>
      </div>`).join("");

    const roster = host.players.map(p => {
      const a = host.assignment[p.token];
      if (!a) return "";
      const r = ROLES[a.role];
      const pw = a.power ? `<span class="p ${a.used ? "used" : ""}">${POWER_BY_ID[a.power].name}${a.used ? ` · użyta ${clock(a.used)}` : ""}</span>` : "";
      const st = a.story !== null ? `<span class="s">${STORIES[a.story].t}</span>` : "";
      return `<li>
        <span><span class="status"><span class="dot ${isOnline(p.token) ? "on" : "off"}"></span></span> ${esc(p.name)}${pw}${st}</span>
        <span class="r" style="color:${r.color}">${r.name}</span>
      </li>`;
    }).join("");

    const log = host.log.length
      ? `<ul class="log">${host.log.map(e => `<li><span>${esc(e.name)}: ${POWER_BY_ID[e.power].name}</span><time>${clock(e.at)}</time></li>`).join("")}</ul>`
      : `<p class="muted">Nikt jeszcze nie użył karty.</p>`;

    return `
      <section class="screen">
        <div>
          <div class="eyebrow">Mafia online · mistrz gry · ${host.code}</div>
          <h2>Gra trwa</h2>
        </div>
        ${statusBadge(ui.status)}
        ${alertHtml}
        ${host.cfg.storiesOn ? `<p>Pierwszego dnia każdy po kolei opowiada swoje backstory.</p>` : ""}
        <div>
          <div class="eyebrow">Role graczy</div>
          <ul class="roster">${roster}</ul>
        </div>
        ${host.cfg.powersOn ? `<div><div class="eyebrow">Użyte karty</div>${log}</div>` : ""}
        <div class="spacer"></div>
        <div class="actions">
          <button class="btn-primary" data-act="host-redeal">Nowe losowanie, ci sami gracze</button>
          <button class="btn-ghost" data-act="host-lobby">Wróć do lobby</button>
          ${ui.confirm === "redeal" ? confirmBox("Wylosować role od nowa? Wszyscy dostaną nowe role i karty.", "host-redeal-yes") : ""}
          ${ui.confirm === "lobby" ? confirmBox("Zakończyć grę i wrócić do lobby? Gracze stracą obecne role.", "host-lobby-yes") : ""}
        </div>
      </section>`;
  }

  // =====================================================================
  // GRACZ
  // =====================================================================
  let player = null;       // { token, name, code, keys: {priv, pub} }
  let playerBus = null;
  let hostKey = null;      // AES key wspólny z mistrzem gry
  let hostPub = null;
  let lobby = null;        // ostatni stan od mistrza gry
  let me = null;
  let lastFromHost = 0;
  let lastSeq = 0;
  let joinedAt = 0;
  let pendingUse = false;

  async function startPlayer(code, name) {
    const prev = readJSON(PLAYER_KEY);
    const sameLobby = prev && prev.code === code && prev.token && prev.keys;
    player = {
      token: sameLobby ? prev.token : randomToken(),
      keys: prev && prev.keys ? prev.keys : await newKeyPair(),
      name, code
    };
    writeJSON(PLAYER_KEY, player);
    lobby = null; me = null; hostKey = null; hostPub = null; lastSeq = 0; lastFromHost = 0;
    pendingUse = false;
    ui.screen = "player";
    ui.status = "connecting";
    ui.error = "";
    ui.reveal = false;
    if (location.hash !== "#" + code) history.replaceState(null, "", "#" + code);
    keepAwake();
    render();
    openPlayerBus();
  }

  function openPlayerBus() {
    if (playerBus) playerBus.end();
    const t = topics(player.code);
    joinedAt = Date.now();
    playerBus = createBus(
      () => [t.host, t.to(player.token)],
      async (topic, msg) => {
        if (topic === t.host) {
          if (!msg || msg.t !== "hello" || !msg.pub) {
            if (!lobby) { ui.status = "notfound"; render(); }
            return;
          }
          if (!samePub(hostPub, msg.pub)) {
            hostPub = msg.pub;
            hostKey = await sharedKey(player.keys.priv, msg.pub);
            lastSeq = 0;
          }
          sendJoin();
          return;
        }
        if (topic === t.to(player.token) && msg && hostKey) {
          let inner;
          try { inner = await open(hostKey, msg); } catch { return; }
          if (typeof inner.seq === "number") {
            if (inner.seq <= lastSeq && inner.seq > 0) return;   // starsza wiadomość
            lastSeq = inner.seq;
          }
          lastFromHost = Date.now();
          handleFromHost(inner);
        }
      },
      () => {
        if (!playerBus) return;
        if (!playerBus.connected()) { ui.status = "offline"; render(); }
        else if (ui.status === "offline" || ui.status === "connecting") { ui.status = lobby ? "online" : "searching"; render(); sendJoin(); }
      }
    );
  }

  function sendJoin() {
    if (!player || !playerBus) return;
    playerBus.publish(topics(player.code).inbox, { t: "join", token: player.token, name: player.name, pub: player.keys.pub });
  }
  async function sendBox(obj) {
    if (!player || !playerBus || !hostKey) return;
    const box = await seal(hostKey, obj);
    playerBus.publish(topics(player.code).inbox, { t: "box", token: player.token, ...box }, { qos: obj.t === "ping" ? 0 : 1 });
  }

  function handleFromHost(msg) {
    if (msg.t === "state") {
      const wasGame = !!me;
      lobby = msg.lobby; me = msg.me;
      if (msg.name && msg.name !== player.name) { player.name = msg.name; writeJSON(PLAYER_KEY, player); }
      if (!wasGame && me) { ui.reveal = false; vibrate(150); }
      if (!me || me.used) pendingUse = false;
      ui.status = "online"; ui.error = "";
      render();
    } else if (msg.t === "pong") {
      if (ui.status !== "online") { ui.status = "online"; render(); }
    } else if (msg.t === "error" || msg.t === "kicked" || msg.t === "closed") {
      ui.status = "refused";
      ui.error = msg.t === "error" ? msg.msg : msg.t === "kicked" ? "Mistrz gry usunął Cię z lobby." : "Mistrz gry zamknął lobby.";
      stopPlayer(false);
      render();
    }
  }

  // Co kilka sekund: ping do mistrza gry albo ponowna prośba o dołączenie.
  setInterval(() => {
    if (!player || !playerBus || ui.screen !== "player" || ui.status === "refused") return;
    if (!playerBus.connected()) return;
    if (!lobby) {
      if (hostKey) sendJoin();
      if (!hostPub && Date.now() - joinedAt > NOTFOUND_MS && ui.status !== "notfound") { ui.status = "notfound"; render(); }
      return;
    }
    sendBox({ t: "ping" });
    const silent = Date.now() - lastFromHost > TIMEOUT_MS;
    if (silent && ui.status === "online") { ui.status = "hostgone"; render(); }
  }, PING_MS);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (playerBus) { playerBus.wake(); if (lobby) sendBox({ t: "ping" }); else sendJoin(); }
    if (hostBus) { hostBus.wake(); if (hostReady) { announce(); } }
  });

  function stopPlayer(forget) {
    if (playerBus) { const b = playerBus; playerBus = null; setTimeout(() => b.end(), 500); }
    if (forget) {
      writeJSON(PLAYER_KEY, null);
      player = null;
      ui.screen = "home";
      history.replaceState(null, "", location.pathname + location.search);
    }
  }

  function renderPlayer() {
    if (ui.status === "refused") {
      return `
        <section class="screen">
          <div><div class="eyebrow">Mafia online · ${esc(player ? player.code : "")}</div><h2>Nie udało się dołączyć</h2></div>
          <p class="warn">${esc(ui.error)}</p>
          <div class="spacer"></div>
          <div class="actions">
            <button class="btn-primary" data-act="retry-join">Spróbuj ponownie</button>
            <button class="btn-ghost" data-act="player-home">Wróć na start</button>
          </div>
        </section>`;
    }

    const badge = {
      online: ["on", "Połączono z mistrzem gry"],
      connecting: ["wait", "Łączę z serwerem…"],
      searching: ["wait", `Szukam lobby ${player.code}…`],
      notfound: ["off", `Nie widzę lobby ${player.code}. Sprawdź kod albo poproś mistrza gry, żeby otworzył stronę lobby.`],
      offline: ["off", "Brak internetu, łączę ponownie…"],
      hostgone: ["off", "Mistrz gry nie odpowiada. Pewnie wygasił ekran. Czekam…"]
    }[ui.status] || ["wait", "Łączę…"];
    const statusHtml = `<span class="status"><span class="dot ${badge[0]}"></span>${badge[1]}</span>`;

    if (!me) {
      const names = lobby ? lobby.players : [];
      return `
        <section class="screen">
          <div>
            <div class="eyebrow">Mafia online · ${player.code}</div>
            <h2>Cześć, ${esc(player.name)}</h2>
          </div>
          ${statusHtml}
          <p class="muted">${lobby ? "Czekaj, aż mistrz gry rozda role. Twoja rola pojawi się tutaj." : "Za chwilę zobaczysz listę graczy."}</p>
          ${lobby ? `
          <div>
            <div class="eyebrow">W lobby (${names.length})</div>
            <ul class="players">${names.map((n, i) => `<li><span class="num">${i + 1}.</span><span class="name">${esc(n)}</span>${n === player.name ? `<span class="tag">to Ty</span>` : ""}</li>`).join("")}</ul>
          </div>` : ""}
          <div class="spacer"></div>
          <div class="actions">
            <button class="btn-ghost" data-act="player-leave">Opuść lobby</button>
            ${ui.confirm === "leave" ? confirmBox("Opuścić lobby?", "player-leave-yes") : ""}
          </div>
        </section>`;
    }

    let footer = "";
    if (me.power) {
      if (me.used) {
        footer = `<p class="note">Karta użyta o ${clock(me.used)}. Mistrz gry dostał powiadomienie.</p>`;
      } else if (pendingUse) {
        footer = `<p class="note">Wysyłam do mistrza gry…</p>`;
      } else if (ui.confirm === "use") {
        footer = confirmBox(`Użyć karty ${POWER_BY_ID[me.power].name}? Mistrz gry dostanie powiadomienie, a karty nie da się użyć drugi raz.`, "use-yes");
      } else {
        footer = `<p class="note">Działa raz na grę.</p>
          <button class="btn-power" data-act="use" ${ui.status === "online" ? "" : "disabled"}>Użyj karty</button>`;
      }
    }

    return `
      <section class="screen">
        <div class="eyebrow">Mafia online · ${player.code}</div>
        ${statusHtml}
        ${ui.reveal
          ? `${renderIdentity(me, me.partners, footer)}
             <button class="btn-ghost" data-act="hide-role">Ukryj</button>`
          : `<div class="veil">
               <span style="font-family:var(--font-display);font-size:2.2rem">${esc(me.name)}</span>
               <p class="muted">Role są rozdane. Zasłoń ekran przed innymi i odkryj swoją rolę.</p>
               <button class="btn-primary" data-act="show-role">Pokaż moją rolę</button>
             </div>
             ${me.power && !me.used ? `<p class="muted">Masz kartę mocy. Przycisk do jej użycia jest pod rolą.</p>` : ""}`}
        <div class="spacer"></div>
      </section>`;
  }

  // =====================================================================
  // START
  // =====================================================================
  function renderHome() {
    const prev = readJSON(PLAYER_KEY);
    const hashCode = cleanCode(location.hash.slice(1));
    const savedHost = readJSON(HOST_KEY);
    return `
      <section class="screen">
        <div>
          <div class="eyebrow">Mafia · każdy na swoim telefonie</div>
          <h1>Mafia online</h1>
        </div>
        <a class="mode-link" href="index.html">← Gra na jednym telefonie</a>

        <form class="actions" id="join-form" autocomplete="off">
          <div class="eyebrow">Dołącz jako gracz</div>
          <div class="field">
            <label class="muted" for="join-code">Kod lobby</label>
            <input class="code-input" id="join-code" type="text" inputmode="text" maxlength="4" placeholder="ABCD" value="${esc(hashCode || (prev && prev.code) || "")}" autocapitalize="characters">
          </div>
          <div class="field">
            <label class="muted" for="join-name">Twoje imię</label>
            <input id="join-name" type="text" maxlength="24" placeholder="Imię" value="${esc((prev && prev.name) || "")}" enterkeyhint="go">
          </div>
          ${ui.error ? `<p class="warn">${esc(ui.error)}</p>` : ""}
          <button class="btn-primary" type="submit">Dołącz</button>
        </form>

        <div class="or">albo</div>

        <div class="actions">
          <div class="eyebrow">Prowadzisz grę?</div>
          ${savedHost ? `<button class="btn-primary" data-act="host-resume">Wróć do lobby ${esc(savedHost.code)}</button>` : ""}
          <button class="${savedHost ? "btn-ghost" : "btn-primary"}" data-act="host-new">Załóż nowe lobby</button>
          <p class="summary">Mistrz gry nie dostaje roli. Ustawia grę, widzi role wszystkich i dostaje powiadomienia o użytych kartach. Najlepiej, żeby jego telefon miał tę stronę otwartą przez całą grę.</p>
        </div>
      </section>`;
  }

  let lastScreen = null;
  function render(quiet) {
    if (quiet && ui.screen !== "host") return;
    const active = document.activeElement;
    if (quiet && active && active.tagName === "INPUT" && app.contains(active)) return;
    const html = ui.screen === "host" ? renderHost() : ui.screen === "player" ? renderPlayer() : renderHome();
    app.innerHTML = html;
    if (ui.screen !== lastScreen) window.scrollTo(0, 0);
    lastScreen = ui.screen;
  }

  // ---------- Events ----------
  app.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id !== "join-form") return;
    const code = cleanCode(document.getElementById("join-code").value);
    const name = cleanName(document.getElementById("join-name").value);
    if (code.length !== 4) { ui.error = "Kod lobby ma 4 litery."; render(); return; }
    if (!name) { ui.error = "Wpisz swoje imię."; render(); return; }
    ui.error = "";
    startPlayer(code, name);
  });

  app.addEventListener("change", e => {
    const act = e.target.dataset.act;
    if (!act || !host) return;
    if (applyConfigAction(host.cfg, act, e.target, host.players.length)) { saveHost(); render(); }
  });

  app.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    if (host && ui.screen === "host" && applyConfigAction(host.cfg, act, btn, host.players.length)) { saveHost(); render(); return; }
    switch (act) {
      // start
      case "host-new": writeJSON(HOST_KEY, null); startHost(null); return;
      case "host-resume": startHost(readJSON(HOST_KEY)); return;
      // mistrz gry
      case "copy-link": {
        const url = lobbyUrl(host.code);
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { btn.textContent = "Skopiowano"; }, () => {});
        return;
      }
      case "kick": removePlayer(btn.dataset.token, true); return;
      case "host-deal": hostDeal(); break;
      case "host-redeal": ui.confirm = "redeal"; break;
      case "host-redeal-yes": ui.confirm = null; hostDeal(); break;
      case "host-lobby": ui.confirm = "lobby"; break;
      case "host-lobby-yes":
        ui.confirm = null; host.phase = "lobby"; host.assignment = {}; host.alerts = [];
        saveHost(); broadcast(); break;
      case "host-close": ui.confirm = "close"; break;
      case "host-close-yes": endHost(); return;
      case "ack": host.alerts = host.alerts.filter(id => id !== btn.dataset.id); saveHost(); break;
      // gracz
      case "show-role": ui.reveal = true; break;
      case "hide-role": ui.reveal = false; ui.confirm = null; break;
      case "use": ui.confirm = "use"; break;
      case "use-yes":
        ui.confirm = null;
        pendingUse = true;
        sendBox({ t: "use" });
        // Gdyby potwierdzenie nie dotarło, pozwól spróbować jeszcze raz.
        setTimeout(() => { if (pendingUse && me && !me.used) { pendingUse = false; render(); } }, 8000);
        break;
      case "player-leave": ui.confirm = "leave"; break;
      case "player-leave-yes":
        ui.confirm = null;
        sendBox({ t: "leave" });
        stopPlayer(true); break;
      case "retry-join": {
        const p = player;
        ui.error = "";
        if (p) startPlayer(p.code, p.name);
        return;
      }
      case "player-home": stopPlayer(true); ui.error = ""; break;
      case "confirm-no": ui.confirm = null; break;
      default: return;
    }
    render();
  });

  // Po odświeżeniu strony wróć tam, gdzie się było.
  const resumeHost = readJSON(HOST_KEY);
  const resumePlayer = readJSON(PLAYER_KEY);
  const hashCode = cleanCode(location.hash.slice(1));
  if (!window.mqtt || !crypto.subtle) {
    app.innerHTML = `<section class="screen"><h2>Brak połączenia</h2><p class="warn">Nie udało się wczytać biblioteki do łączenia telefonów. Sprawdź internet i odśwież stronę.</p></section>`;
  } else if (resumeHost && !hashCode) {
    startHost(resumeHost);
  } else if (resumePlayer && resumePlayer.code && resumePlayer.name && (!hashCode || hashCode === resumePlayer.code)) {
    startPlayer(resumePlayer.code, resumePlayer.name);
  } else {
    render();
  }
})();
</script>
</body>
</html>
